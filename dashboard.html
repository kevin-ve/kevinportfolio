<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | NET Academy</title><link rel="stylesheet" href="auth.css"></head>
<body>
<a class="brand" href="index.html"><span class="logo">N</span>NET Academy</a>
<main class="card" id="card" style="visibility:hidden">
  <h1 id="hi">Welcome</h1>
  <p class="sub" id="em"></p>
  <p><b>Your progress</b><br><span class="sub" id="tot" style="margin:0"></span></p>
  <div id="lessons"></div>
  <button class="btn" id="out">Log out</button>
</main>
<script type="module">
import { sb, configured } from "./supabase-config.js";
const $=id=>document.getElementById(id);
async function start(){
  if(!configured){location.replace("login.html");return}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.replace("login.html");return}
  const user=session.user;
  let name=(user.user_metadata&&user.user_metadata.full_name)||"";
  const {data}=await sb.from("profiles").select("full_name").eq("id",user.id).maybeSingle();
  if(data&&data.full_name) name=data.full_name;
  $("hi").textContent="Welcome, "+(name.split(" ")[0]||"learner")+"!";
  $("em").textContent=user.email;
  const H=["What is HTML?","Text formatting and lists","Links and images","Tables","Forms and inputs","Semantic page layout","Attributes, div and span","Project: your personal page"];
  const Cs=["CSS basics and selectors","Colors, backgrounds and text","The box model and display","Positioning","Flexbox","Grid","Responsive design","Pseudo-classes, variables and motion","Project: style your page"];
  const Js=["Meet JavaScript","Variables and data types","Operators and decisions","Loops and arrays","Functions"];
  const all=[...H.map((t,i)=>({n:i+1,k:i+1,t,f:"lesson-html-"+(i+1)+".html",g:i?"":"HTML course"})),...Cs.map((t,i)=>({n:9+i,k:i+1,t,f:"lesson-css-"+(i+1)+".html",g:i?"":"CSS course"})),...Js.map((t,i)=>({n:18+i,k:i+1,t,f:"lesson-js-"+(i+1)+".html",g:i?"":"JavaScript course"}))];
  const {data:rows,error:pe}=await sb.from("lesson_progress").select("lesson,points").eq("user_id",user.id);
  const got=new Map((rows||[]).map(r=>[r.lesson,r.points]));let tot=0;got.forEach(v=>tot+=v);
  $("tot").textContent=got.size+" of "+all.length+" lessons complete, "+tot+" points";
  if(pe){$("tot").textContent="Could not load progress: "+pe.message;$("tot").style.color="var(--err)"}
  all.forEach(x=>{
    if(x.g){const h=document.createElement("p");h.style.cssText="margin:20px 0 0;font-weight:700";h.textContent=x.g;$("lessons").appendChild(h)}
    const open=x.n===1||got.has(x.n-1),dn=got.has(x.n);
    const el=document.createElement(open?"a":"button");el.className="btn";
    el.style.cssText="display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;text-decoration:none;margin-top:8px";
    if(open)el.href=x.f;else el.disabled=true;
    const l=document.createElement("span");l.textContent=x.k+". "+x.t;
    const r=document.createElement("span");r.style.cssText="font-size:.8rem;white-space:nowrap";r.textContent=dn?"Completed":(open?"Start":"Locked");
    el.append(l,r);if(dn)el.style.background="var(--ok)";$("lessons").appendChild(el);
  });
  $("card").style.visibility="visible";
}
$("out").onclick=async()=>{await sb.auth.signOut();location.href="index.html"};
start();
</script></body></html>

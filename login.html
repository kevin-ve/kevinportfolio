<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | NET Academy</title><link rel="stylesheet" href="auth.css"></head>
<body>
<a class="brand" href="index.html"><span class="logo">N</span>NET Academy</a>
<main class="card">
  <h1>Welcome back</h1>
  <p class="sub">Log in to continue learning.</p>
  <form id="f" novalidate>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email" inputmode="email" required>
    <label for="pw">Password</label>
    <div class="pw"><input id="pw" type="password" autocomplete="current-password" required><button type="button" id="show">Show</button></div>
    <button class="btn" id="go" type="submit" style="margin-top:14px">Log in</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <p class="alt">New here? <a href="signup.html">Create an account</a></p>
</main>
<script type="module">
import { sb, configured, friendly } from "./supabase-config.js";
const $=id=>document.getElementById(id), msg=$("msg");
const say=(t,c)=>{msg.textContent=t;msg.className="msg "+c};
$("show").onclick=()=>{const p=$("pw"),h=p.type==="password";p.type=h?"text":"password";$("show").textContent=h?"Hide":"Show"};
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!configured) return say("Setup needed: add your Supabase settings in supabase-config.js","err");
  $("go").disabled=true;say("Logging in...","ok");
  const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pw").value});
  if(error){say(friendly(error),"err");$("go").disabled=false;return}
  location.href="dashboard.html";
});
</script></body></html>

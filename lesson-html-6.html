<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Lesson 6: Semantic page layout | NET Academy</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--ink:#0e1a33;--muted:#55627e;--line:#d9e0ec;--accent:#1f3fd6;--accent-d:#162faa;--accent-ink:#fff;--soft:#e9edfb;--code:#0e1a33;--code-ink:#e9eeff;--ok:#157347;--okbg:#e4f5ec;--err:#b42329;--errbg:#fdeceb;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0a1222;--surface:#121e38;--ink:#eef2fb;--muted:#9aa8c7;--line:#243259;--accent:#8197ff;--accent-d:#a0b0ff;--accent-ink:#0a1222;--soft:#1a2850;--code:#070d1b;--ok:#6fd39b;--okbg:#12362a;--err:#ff8c91;--errbg:#3a1a20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--sans);min-height:100vh}
:focus-visible{outline:3px solid #ffc83d;outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top{max-width:760px;margin:0 auto;padding:0 16px;height:54px;display:flex;align-items:center;gap:12px}
.x{color:var(--muted);text-decoration:none;font-size:1.5rem;line-height:1;padding:6px 8px 6px 0}
.ttl{flex:1;font-weight:650;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{color:var(--muted);font-weight:500}
.pts{font:650 .85rem var(--sans);background:var(--soft);color:var(--accent);padding:5px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
.steps{max-width:760px;margin:0 auto;padding:0 16px 10px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ph{font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.ph i{display:block;height:5px;border-radius:9px;background:var(--line);margin-bottom:4px;overflow:hidden}
.ph i b{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.ph.on{color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:22px 16px 120px;visibility:hidden}
.page{display:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 22px}
.page.on{display:block}
.eyebrow{margin:0 0 6px;font:700 .75rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(1.6rem,5.5vw,2.1rem)/1.2 var(--serif);margin:0 0 14px}
h3{margin:0 0 6px;font-size:1.02rem}
p{margin:0 0 12px}ul,ol{margin:6px 0 12px;padding-left:22px}li{margin:3px 0}
.lead{font-size:1.1rem}
.meta{color:var(--muted);font-size:.9rem}
.m{color:var(--muted)}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.key{border-left:4px solid var(--accent);background:var(--soft);padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 0}
.warn{border-left:4px solid var(--err);background:var(--errbg);padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 0}
.key b,.warn b{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
code{font:.9em var(--mono);background:var(--soft);padding:2px 6px;border-radius:5px}
pre{background:var(--code);color:var(--code-ink);border-radius:10px;padding:14px 16px;margin:10px 0 4px;overflow-x:auto;font:.9rem/1.65 var(--mono)}
pre code{background:none;padding:0;color:inherit;font-size:inherit}
.cap{font-size:.85rem;color:var(--muted);margin:0 0 14px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.93rem;margin:8px 0 14px}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}th{background:var(--bg)}
.q{margin:20px 0;padding-top:18px;border-top:1px solid var(--line)}.q:first-of-type{border-top:0;padding-top:4px}
.qt{font-weight:650;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{min-height:48px;text-align:left;padding:10px 14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:500 .98rem var(--sans);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--err);background:var(--errbg)}
.fb{margin:8px 0 0;font-size:.93rem;font-weight:600;min-height:1px}.fb.ok{color:var(--ok)}.fb.no{color:var(--err)}
.lab ul.req{list-style:none;padding:0;margin:8px 0 12px}
.req li{padding:3px 0 3px 26px;position:relative;font-size:.95rem;color:var(--muted)}
.req li::before{content:"";position:absolute;left:2px;top:9px;width:13px;height:13px;border:2px solid var(--line);border-radius:50%}
.req li.ok{color:var(--ink)}.req li.ok::before{background:var(--ok);border-color:var(--ok)}
.ed{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.ed textarea{display:block;width:100%;height:170px;border:0;resize:vertical;padding:12px 14px;background:var(--code);color:var(--code-ink);font:16px/1.55 var(--mono)}
.ed .l{padding:5px 12px;font-size:.75rem;color:var(--muted);background:var(--bg);border-block:1px solid var(--line);font-weight:600}
.ed iframe{display:block;width:100%;height:120px;border:0;background:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sm{min-height:42px;padding:0 16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:650 .9rem var(--sans);cursor:pointer}
.hint{display:none;background:var(--soft);padding:10px 14px;border-radius:10px;margin:6px 0;font-size:.93rem}
.btn{min-height:50px;padding:0 24px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 1rem var(--sans);cursor:pointer}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.res{margin:16px 0;padding:16px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.res .big{font:700 2rem/1.1 var(--serif)}.res .st{font-weight:700}.res.pass .st{color:var(--ok)}.res.fail .st{color:var(--err)}
.rv{font-size:.92rem;margin:8px 0;padding:8px 0;border-top:1px solid var(--line)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.foot div{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.foot .btn{flex:1}.foot .sm{flex:0 0 auto}
.cnt{font-size:.8rem;color:var(--muted);min-width:64px;text-align:center}
.toast{position:fixed;left:50%;top:78px;transform:translate(-50%,-16px);background:var(--ink);color:var(--bg);font:650 .88rem var(--sans);padding:7px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){.page{padding:20px 16px}}
</style>
</head>

<header>
  <div class="top"><a class="x" href="dashboard.html" aria-label="Exit lesson">&times;</a><div class="ttl">Lesson 6 <span>&middot; Semantic page layout</span></div><span class="pts" id="pts">0 pts</span></div>
  <div class="steps" id="steps"></div>
</header>
<div class="toast" id="toast"></div>
<main id="main"></main>
<div class="foot"><div>
  <button class="sm" id="back" type="button">Back</button>
  <span class="cnt" id="cnt"></span>
  <button class="btn" id="next" type="button">Continue</button>
</div></div>

<script type="module">
import { sb, configured } from "./supabase-config.js";
const $=id=>document.getElementById(id);
const LESSON_NO=6;let uid=null;
(async()=>{
  if(!configured){location.replace("login.html");return}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.replace("login.html");return}
  uid=session.user.id;
  if(LESSON_NO>1){
    const {data}=await sb.from("lesson_progress").select("lesson").eq("user_id",uid).eq("lesson",LESSON_NO-1).maybeSingle();
    if(!data){location.replace("dashboard.html");return}
  }
  $("main").style.visibility="visible";
})();
async function save(){
  if(typeof sb==="undefined"||!uid)return;
  await sb.from("lesson_progress").upsert({user_id:uid,lesson:LESSON_NO,points},{onConflict:"user_id,lesson"});
}

const E=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const C=s=>`<pre><code>${E(s)}</code></pre>`, I=s=>`<code>${E(s)}</code>`;
const PH=["Intro","Concepts","Test","Lab","Final"];

/* ============ LESSON CONTENT (edit this part for each new lesson) ============ */
const cnt=(v,t,c)=>{const m=v.match(new RegExp("<"+t+">([\\s\\S]*?)</"+t+">","i"));return m?(m[1].match(new RegExp("<"+c+">[^<]+</"+c+">","gi"))||[]).length:0};
const n=(v,re)=>(v.match(re)||[]).length;
const HOW='<div class="panel"><h3>How this lesson works</h3><ol><li><b>Introduction check:</b> confirm what you will study.</li><li><b>Three core concepts:</b> read and study each one.</li><li><b>Concepts test:</b> 100% unlocks the lab.</li><li><b>Practice lab:</b> two coding exercises.</li><li><b>Final test:</b> 100% completes the lesson.</li></ol></div>';
const intro=(lead,list,why,pre)=>({phase:0,type:"read",title:"Welcome",label:"Introduction",html:`<p class="lead">${lead}</p><div class="panel"><h3>What you will learn</h3><ul>${list.map(x=>"<li>"+x+"</li>").join("")}</ul></div><div class="panel"><h3>Why it matters</h3><p>${why}</p></div>${HOW}<p class="meta">Level: Beginner &middot; Time: about 30 minutes &middot; Prerequisites: ${pre}</p>`});
const gate='<div class="panel"><h3>Next step</h3><p>After this concept you take the <b>Concepts test</b>. You need <b>100%</b> to unlock the practice lab.</p></div>';
const linked=v=>{const m=v.match(/<label\s[^>]*for=["']([^"']+)["']/i);return !!m&&new RegExp('<input\\s[^>]*id=["\']'+m[1]+'["\']','i').test(v)};
const pages=[
intro("Professional pages are organised into meaningful regions. In this lesson you will structure a page the way real websites do.",["Explain why semantic elements matter","Build header, nav, main and footer","Group content with section, article and aside","Write cleaner, more accessible pages"],"Semantic elements help screen readers, search engines and other developers understand your page at a glance.","Lessons 1 to 5"),
{phase:0,type:"quiz",title:"Introduction check",label:"Introduction",intro:"Every answer must be correct to continue.",pts:5,qs:[
 {q:"What will you learn in this lesson?",o:["Semantic page layout","Forms","Tables"],a:0,e:"This lesson is about page layout with semantic elements."},
 {q:"Who benefits from semantic HTML?",o:["Screen readers and search engines","Nobody","Only printers"],a:0,e:"Semantics help assistive tools and search engines."},
 {q:"What score is needed to pass each test?",o:["100%","70%","50%"],a:0,e:"Every test requires 100%."}]},
{phase:1,type:"read",title:"Why semantic HTML",label:"Concept 1 of 3",html:`
<p>A ${I("<div>")} says nothing about its content. Semantic elements say what the content <b>is</b>:</p>
${C(`<!-- Unclear -->\n<div class="header">Welcome</div>\n\n<!-- Clear -->\n<header>Welcome</header>`)}
<div class="key"><b>Key idea</b>Semantic elements give the page meaning. Screen readers can jump between regions, search engines understand the page better, and your code is easier to read.</div>
<div class="warn"><b>Common mistake</b>Building a whole page from ${I("<div>")} elements when meaningful elements exist.</div>`},
{phase:1,type:"read",title:"Page regions",label:"Concept 2 of 3",html:`
<p>Most pages share the same four regions:</p>
${C(`<body>\n  <header><h1>My Site</h1></header>\n  <nav><a href="index.html">Home</a></nav>\n  <main><p>Main content</p></main>\n  <footer><p>Contact details</p></footer>\n</body>`)}
<div class="tw"><table><tr><th>Element</th><th>Holds</th></tr><tr><td>${I("<header>")}</td><td>Title, logo, introduction</td></tr><tr><td>${I("<nav>")}</td><td>Main navigation links</td></tr><tr><td>${I("<main>")}</td><td>The central content of the page</td></tr><tr><td>${I("<footer>")}</td><td>Contact details, copyright</td></tr></table></div>
<div class="key"><b>Key idea</b>A page has only <b>one</b> ${I("<main>")} element.</div>`},
{phase:1,type:"read",title:"Sections, articles and asides",label:"Concept 3 of 3",html:`
<p>Inside the main area, group content further:</p>
${C(`<main>\n  <section>\n    <h2>Latest news</h2>\n    <article>\n      <h3>A new lesson</h3>\n      <p>Lesson 6 is live.</p>\n    </article>\n  </section>\n  <aside><p>Tip: practise daily.</p></aside>\n</main>`)}
<div class="tw"><table><tr><th>Element</th><th>Use</th></tr><tr><td>${I("<section>")}</td><td>A themed group, usually with a heading</td></tr><tr><td>${I("<article>")}</td><td>Self-contained content, such as a post</td></tr><tr><td>${I("<aside>")}</td><td>Related side information</td></tr></table></div>${gate}`},
{phase:2,type:"final",title:"Concepts test",label:"Concepts test",pass:1,pts:5,intro:"This test covers all three concepts.",okMsg:()=>"You scored 100%. The practice lab is now unlocked.",qs:[
 {q:"What do semantic elements describe?",o:["What the content is","How it looks","How fast it loads"],a:0,ref:"Concept 1: Why semantic",e:"They describe meaning."},
 {q:"Which holds the main navigation links?",o:["<nav>","<aside>","<footer>"],a:0,ref:"Concept 2: Page regions",e:"nav holds navigation."},
 {q:"How many main elements should a page have?",o:["One","Two","Ten"],a:0,ref:"Concept 2: Page regions",e:"One main per page."},
 {q:"Which element suits a blog post that stands alone?",o:["<article>","<aside>","<nav>"],a:0,ref:"Concept 3: Sections and articles",e:"article is self-contained."},
 {q:"Which element holds related side information?",o:["<aside>","<header>","<main>"],a:0,ref:"Concept 3: Sections and articles",e:"aside is side information."},
 {q:"Which holds contact details at the bottom?",o:["<footer>","<header>","<section>"],a:0,ref:"Concept 2: Page regions",e:"footer is the bottom region."}]},
{phase:3,type:"lab",title:"Exercise 1: Page regions",label:"Practice lab 1 of 2",pts:20,task:"Build the four regions: a header with an h1, a nav with a link, a main with a paragraph, and a footer.",start:"",
 reqs:[["A header containing an h1",v=>/<header>[\s\S]*<h1>[^<]+<\/h1>[\s\S]*<\/header>/i.test(v)],["A nav containing a link",v=>/<nav>[\s\S]*<a\s[^>]*href=["'][^"']+["'][^>]*>[^<]+<\/a>[\s\S]*<\/nav>/i.test(v)],["A main containing a paragraph",v=>/<main>[\s\S]*<p>[^<]+<\/p>[\s\S]*<\/main>/i.test(v)],["A footer with text",v=>/<footer>[\s\S]*[^<\s][\s\S]*<\/footer>/i.test(v)]],
 hint:"Place <header>, <nav>, <main> and <footer> one after another.",sol:'<header><h1>My Site</h1></header>\n<nav><a href="index.html">Home</a></nav>\n<main><p>Welcome to my site.</p></main>\n<footer><p>Contact me</p></footer>'},
{phase:3,type:"lab",title:"Exercise 2: Article and aside",label:"Practice lab 2 of 2",pts:20,task:"Inside a main element, add an article with an h2 and a paragraph, plus an aside with a paragraph.",start:"",
 reqs:[["A main element",v=>/<main>[\s\S]*<\/main>/i.test(v)],["An article with an h2 and a paragraph",v=>/<article>[\s\S]*<h2>[^<]+<\/h2>[\s\S]*<p>[^<]+<\/p>[\s\S]*<\/article>/i.test(v)],["An aside with a paragraph",v=>/<aside>[\s\S]*<p>[^<]+<\/p>[\s\S]*<\/aside>/i.test(v)]],
 hint:"<main><article>...</article><aside>...</aside></main>",sol:"<main>\n  <article>\n    <h2>Today</h2>\n    <p>I learned semantic HTML.</p>\n  </article>\n  <aside><p>Tip: practise daily.</p></aside>\n</main>"},
{phase:4,type:"final",title:"Final test",label:"Final test",pass:1,pts:5,intro:"This is the last step of the lesson.",okMsg:()=>"You scored 100%. Total points: "+points+" / "+MAX+". Next: Lesson 7, Attributes, div and span.",qs:[
 {q:"Which is more meaningful?",o:["<header>","<div class=\"top\">","<span>"],a:0,ref:"Concept 1",e:"header carries meaning."},
 {q:"Where do top-of-page title and logo belong?",o:["<header>","<footer>","<aside>"],a:0,ref:"Concept 2",e:"header holds the title area."},
 {q:"Which holds the central content?",o:["<main>","<nav>","<aside>"],a:0,ref:"Concept 2",e:"main is central content."},
 {q:"A themed group of content with a heading is a:",o:["<section>","<br>","<hr>"],a:0,ref:"Concept 3",e:"section groups themed content."},
 {q:"Which suits related side tips?",o:["<aside>","<main>","<title>"],a:0,ref:"Concept 3",e:"aside is for side information."},
 {q:"Why prefer semantic elements?",o:["They help accessibility and search engines","They load faster images","They add colour"],a:0,ref:"Concept 1",e:"Meaning helps tools and people."}]}
];
/* ============ END OF LESSON CONTENT ============ */

/* ---------- engine ---------- */
const N=pages.length,done=Array(N).fill(false);let cur=0,points=0;
const MAX=pages.reduce((s,p)=>s+(p.type==="lab"?p.pts:(p.qs?p.qs.length*p.pts:0)),0);
const main=$("main");
function add(n){if(!n)return;points+=n;$("pts").textContent=points+" pts";const t=$("toast");t.textContent="+"+n+" points";t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1000)}
function complete(i){done[i]=true;refresh();if(i===N-1)save()}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

pages.forEach((pg,i)=>{
  const sec=mk("section","page");sec.dataset.i=i;
  sec.appendChild(mk("p","eyebrow",pg.label));
  sec.appendChild(mk("h1",null,pg.title));
  if(pg.type==="read"){const d=mk("div");d.innerHTML=pg.html;sec.appendChild(d);done[i]=true}
  if(pg.type==="quiz")buildQuiz(sec,pg,i);
  if(pg.type==="lab")buildLab(sec,pg,i);
  if(pg.type==="final")buildFinal(sec,pg,i);
  main.appendChild(sec);
});

function buildQuiz(sec,pg,i){
  sec.appendChild(mk("p","m",pg.intro));let ok=0;
  pg.qs.forEach((it,k)=>{
    const box=mk("div","q");box.appendChild(mk("p","qt",(k+1)+". "+it.q));
    const og=mk("div","opts"),fb=mk("div","fb");let missed=false,solved=false;
    it.o.forEach((t,j)=>{
      const b=mk("button","opt",t);b.type="button";
      b.onclick=()=>{
        if(solved)return;
        if(j===it.a){solved=true;b.classList.add("good");fb.className="fb ok";fb.textContent="Correct. "+it.e;og.querySelectorAll(".opt").forEach(x=>x.disabled=true);add(missed?pg.pts/2:pg.pts);ok++;if(ok===pg.qs.length)complete(i)}
        else{missed=true;b.classList.add("bad");b.disabled=true;fb.className="fb no";fb.textContent="Not quite. Try another answer."}
      };og.appendChild(b);
    });
    box.appendChild(og);box.appendChild(fb);sec.appendChild(box);
  });
}

function buildLab(sec,pg,i){
  sec.classList.add("lab");
  sec.appendChild(mk("p",null,pg.task));
  sec.appendChild(mk("p","m","Requirements:"));
  const ul=mk("ul","req");pg.reqs.forEach(r=>ul.appendChild(mk("li",null,r[0])));sec.appendChild(ul);
  const ed=mk("div","ed"),l1=mk("div","l","Your code"),ta=mk("textarea"),l2=mk("div","l","Result"),fr=mk("iframe");
  ta.value=pg.start;ta.spellcheck=false;ta.setAttribute("autocapitalize","off");ta.setAttribute("autocorrect","off");ta.setAttribute("aria-label","Your code");
  fr.title="Result";fr.setAttribute("sandbox","");fr.srcdoc=pg.start;
  [l1,ta,l2,fr].forEach(x=>ed.appendChild(x));sec.appendChild(ed);
  const tools=mk("div","tools"),hb=mk("button","sm","Show hint"),sb2=mk("button","sm","Show solution"),rb=mk("button","sm","Reset");
  [hb,sb2,rb].forEach(b=>{b.type="button";tools.appendChild(b)});sec.appendChild(tools);
  const hint=mk("div","hint",pg.hint);sec.appendChild(hint);
  let usedSol=false;
  const check=()=>{
    fr.srcdoc=ta.value;let all=true;
    [...ul.children].forEach((li,k)=>{const p=pg.reqs[k][1](ta.value);li.classList.toggle("ok",p);if(!p)all=false});
    if(all&&!done[i]){add(usedSol?pg.pts/2:pg.pts);complete(i)}
  };
  ta.addEventListener("input",check);
  hb.onclick=()=>{hint.style.display=hint.style.display==="block"?"none":"block"};
  sb2.onclick=()=>{if(!done[i]&&!confirm("Show the solution? You will earn half the points for this exercise."))return;if(!done[i])usedSol=true;ta.value=pg.sol;check()};
  rb.onclick=()=>{ta.value=pg.start;check()};
  fr.srcdoc=pg.start;
}

function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function buildFinal(sec,pg,i){
  const need=Math.round(pg.pass*100);
  sec.appendChild(mk("p","m",pg.intro+" Answer all "+pg.qs.length+" questions, then submit. You need "+need+"% to continue. You can retake the test, and the order of questions and answers changes each time."));
  const ans={},wrap=mk("div"),res=mk("div"),sub=mk("button","btn","Submit test");sub.type="button";let best=0;
  const render=()=>{
    wrap.innerHTML="";res.innerHTML="";sub.style.display="";sub.disabled=true;
    Object.keys(ans).forEach(k=>delete ans[k]);
    shuffle(pg.qs.map((q,k)=>k)).forEach((qi,n)=>{
      const it=pg.qs[qi],box=mk("div","q");box.appendChild(mk("p","qt",(n+1)+". "+it.q));const og=mk("div","opts");
      shuffle(it.o.map((t,j)=>j)).forEach(j=>{
        const b=mk("button","opt",it.o[j]);b.type="button";
        b.onclick=()=>{ans[qi]=j;og.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sub.disabled=Object.keys(ans).length<pg.qs.length};
        og.appendChild(b);
      });
      box.appendChild(og);wrap.appendChild(box);
    });
  };
  sub.onclick=()=>{
    const right=pg.qs.filter((it,k)=>ans[k]===it.a).length,pct=right/pg.qs.length,passed=pct>=pg.pass;
    if(right>best){add((right-best)*pg.pts);best=right}
    sub.style.display="none";wrap.innerHTML="";res.innerHTML="";
    const box=mk("div","res "+(passed?"pass":"fail"));
    box.appendChild(mk("div","big",right+" / "+pg.qs.length+"  ("+Math.round(pct*100)+"%)"));
    box.appendChild(mk("div","st",passed?"Passed":"Not passed. "+need+"% is required."));
    box.appendChild(mk("p","m",passed?pg.okMsg():"Every question must be correct to continue. Review the topics listed below, then retake the test."));
    pg.qs.forEach((it,k)=>{
      const ok=ans[k]===it.a,d=mk("div","rv");
      d.textContent=passed?(k+1)+". Correct. "+it.e:(ok?"Correct: "+it.q:"Incorrect: "+it.q+"  Review: "+it.ref+".");
      d.style.color=ok?"var(--ok)":"var(--err)";box.appendChild(d);
    });
    if(!passed){const rt=mk("button","btn","Retake test");rt.type="button";rt.style.marginTop="12px";rt.onclick=()=>{render()};box.appendChild(rt)}
    res.appendChild(box);if(passed)complete(i);
  };
  sec.appendChild(wrap);sec.appendChild(sub);sec.appendChild(res);render();
}

/* ---------- navigation ---------- */
const stepsEl=$("steps");
PH.forEach(n=>{const d=mk("div","ph");d.innerHTML='<i><b></b></i>';d.appendChild(document.createTextNode(n));stepsEl.appendChild(d)});
function refresh(){
  document.querySelectorAll(".page").forEach((s,k)=>s.classList.toggle("on",k===cur));
  [...stepsEl.children].forEach((el,p)=>{
    const idx=pages.map((x,k)=>x.phase===p?k:-1).filter(k=>k>=0);
    const d=idx.filter(k=>done[k]&&(pages[k].type!=="read"||k<cur||(k===cur))).length;
    el.querySelector("b").style.width=Math.round(d/idx.length*100)+"%";el.classList.toggle("on",pages[cur].phase===p);
  });
  const last=cur===N-1;
  $("back").style.visibility=cur===0?"hidden":"visible";
  $("cnt").textContent=(cur+1)+" / "+N;
  $("next").textContent=last?"Finish lesson":"Continue";
  $("next").disabled=!done[cur];
}
$("next").onclick=()=>{if(cur===N-1){location.href="dashboard.html"}else{cur++;refresh();window.scrollTo(0,0)}};
$("back").onclick=()=>{if(cur>0){cur--;refresh();window.scrollTo(0,0)}};
refresh();
</script>

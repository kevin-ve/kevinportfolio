<script type="module">
import { sb, configured } from "./supabase-config.js";
const $=id=>document.getElementById(id);
const LESSON_NO=18;let uid=null,saved=false;
(async()=>{

function showSave(t,bad){const m=$("savemsg");m.textContent=t;m.style.color=bad?"var(--err)":"var(--ok)"}
async function save(){
  if(typeof sb==="undefined"||!uid){saved=true;return}
  showSave("Saving your progress...");
  const {error}=await sb.from("lesson_progress").upsert({user_id:uid,lesson:LESSON_NO,points},{onConflict:"user_id,lesson"});
  if(error){saved=false;showSave("Progress could not be saved ("+error.message+"). Tap Finish lesson to try again.",true)}
  else{saved=true;showSave("Progress saved.")}
}
/*END*/

const E=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const C=s=>`<pre><code>${E(s)}</code></pre>`, I=s=>`<code>${E(s)}</code>`;
const PH=["Intro","Concepts","Test","Lab","Final"];

/* ============ LESSON CONTENT (edit this part for each new lesson) ============ */
const cnt=(v,t,c)=>{const m=v.match(new RegExp("<"+t+">([\\s\\S]*?)</"+t+">","i"));return m?(m[1].match(new RegExp("<"+c+">[^<]+</"+c+">","gi"))||[]).length:0};
const n=(v,re)=>(v.match(re)||[]).length;
const HOW='<div class="panel"><h3>How this lesson works</h3><ol><li><b>Introduction check:</b> confirm what you will study.</li><li><b>Three core concepts:</b> read and study each one.</li><li><b>Concepts test:</b> 100% unlocks the lab.</li><li><b>Practice lab:</b> two coding exercises.</li><li><b>Final test:</b> 100% completes the lesson.</li></ol></div>';
const intro=(lead,list,why,pre)=>({phase:0,type:"read",title:"Welcome",label:"Introduction",html:`<p class="lead">${lead}</p><div class="panel"><h3>What you will learn</h3><ul>${list.map(x=>"<li>"+x+"</li>").join("")}</ul></div><div class="panel"><h3>Why it matters</h3><p>${why}</p></div>${HOW}<p class="meta">Level: Beginner &middot; Time: about 30 minutes &middot; Prerequisites: ${pre}</p>`});
const gate='<div class="panel"><h3>Next step</h3><p>After this concept you take the <b>Concepts test</b>. You need <b>100%</b> to unlock the practice lab.</p></div>';
const linked=v=>{const m=v.match(/<label\s[^>]*for=["']([^"']+)["']/i);return !!m&&new RegExp('<input\\s[^>]*id=["\']'+m[1]+'["\']','i').test(v)};
const rule=(v,sel,prop)=>new RegExp(sel+"\\s*\\{[^}]*"+(prop?prop+"\\s*:":""),"i").test(v);
const rv=(v,sel,prop,val)=>new RegExp(sel+"\\s*\\{[^}]*"+prop+"\\s*:\\s*"+val,"i").test(v);
const has=(o,s)=>o.includes(s);const lines=o=>o.split("\n").filter(x=>x!=="");
const pages=[
intro("JavaScript is the language that makes web pages come alive. In this first lesson you will learn what it is, how your first program runs, and how to read the errors that every programmer meets.",["Explain what JavaScript does and where it runs","Add JavaScript to a page","Write statements, comments and console.log output","Read and fix the three common error types"],"HTML builds the page and CSS styles it, but only JavaScript lets the page think and react. It is the most widely used programming language in the world, and the foundation for web apps, servers and mobile apps.","the HTML and CSS courses"),
{phase:0,type:"quiz",title:"Introduction check",label:"Introduction",intro:"Every answer must be correct to continue.",pts:5,qs:[
 {q:"What will you learn in this lesson?",o:["The basics of JavaScript","Table layouts","Image editing"],a:0,e:"This lesson introduces JavaScript."},
 {q:"Which part of a website does JavaScript mainly control?",o:["Behaviour","Structure","Color"],a:0,e:"JavaScript controls behaviour."},
 {q:"What score is needed to pass each test?",o:["100%","70%","50%"],a:0,e:"Every test requires 100%."}]},
{phase:1,type:"read",title:"What JavaScript is and where it runs",label:"Concept 1 of 3",html:`
<p>Think of a web page as a person. <b>HTML</b> is the skeleton (structure), <b>CSS</b> is the skin and clothes (appearance), and <b>JavaScript</b> is the muscles and brain (behaviour). Without JavaScript a page can only be read. With it, a page can react to clicks, check a form, calculate a price, load new data and change itself without reloading.</p>
<div class="tw"><table><tr><th>Language</th><th>Role</th><th>Example</th></tr><tr><td>HTML</td><td>Structure</td><td>"This is a button"</td></tr><tr><td>CSS</td><td>Appearance</td><td>"Make it blue and round"</td></tr><tr><td>JavaScript</td><td>Behaviour</td><td>"When clicked, show a message"</td></tr></table></div>
<p>JavaScript is a <b>programming language</b>. A program is a list of instructions that a computer follows, one after another. Every browser contains a <b>JavaScript engine</b> that reads your code and runs it. The same language also runs outside the browser: on servers (Node.js), in mobile apps and in desktop apps. You learn it once and use it everywhere.</p>
<p>To use JavaScript in a web page, you add a ${I("<script>")} element:</p>
${C(`<!-- Option 1: an external file (best for real projects) -->\n<script src="app.js" defer><\/script>\n\n<!-- Option 2: code written directly in the page -->\n<script>\n  console.log("Hello from JavaScript");\n<\/script>`)}
<div class="key"><b>Key idea</b>The language is the same everywhere. Only the <b>environment</b> changes. In this course, the code box runs your code safely and shows the output, so you can practise without setting anything up.</div>
<div class="warn"><b>Common mistake</b>Confusing JavaScript with Java. They are different languages with a similar name, like "car" and "carpet".</div>`},
{phase:1,type:"read",title:"Statements, console.log and comments",label:"Concept 2 of 3",html:`
<p>A program is made of <b>statements</b>. Each statement is one instruction. The computer reads them <b>from top to bottom</b>, one at a time, exactly in the order you wrote them.</p>
${C(`console.log("Step 1");\nconsole.log("Step 2");\nconsole.log("Step 3");`)}
<p>Output:</p>
<pre><code>Step 1\nStep 2\nStep 3</code></pre>
<p>The computer ran line 1, then line 2, then line 3. If you swap the lines, the output order swaps too. Now look at one statement in detail:</p>
<div class="tw"><table><tr><th>Piece</th><th>What it is</th></tr><tr><td>${I("console")}</td><td>A built-in tool for showing messages to the developer</td></tr><tr><td>${I(".")}</td><td>"Use something that belongs to console"</td></tr><tr><td>${I("log")}</td><td>The action: print a value</td></tr><tr><td>${I("( )")}</td><td>Hold the information you give to the action</td></tr><tr><td>${I('"Step 1"')}</td><td>A <b>string</b>: text inside quotes</td></tr><tr><td>${I(";")}</td><td>Marks the end of the statement</td></tr></table></div>
<p><b>Comments</b> are notes for humans. The computer ignores them:</p>
${C(`// A single-line comment\nconsole.log("Visible");   // a comment after code\n\n/* A comment\n   over several lines */`)}
<div class="key"><b>Key idea</b>JavaScript is <b>case-sensitive</b>. ${I("console.log")} works, but ${I("Console.Log")} does not. Strings need matching quotes: ${I('"Hi"')} or ${I("'Hi'")}.</div>
<div class="warn"><b>Common mistake</b>Forgetting a quote or bracket. Every opening ${I("(")} needs a closing ${I(")")}, and every opening quote needs a closing quote.</div>`},
{phase:1,type:"read",title:"Reading errors and debugging",label:"Concept 3 of 3",html:`
<p>Every programmer, from beginner to expert, sees errors daily. An error is not a failure. It is the computer telling you exactly what it could not understand. Learning to <b>read</b> error messages is one of the most valuable skills you will build.</p>
<div class="tw"><table><tr><th>Error type</th><th>Meaning</th><th>Typical cause</th></tr><tr><td>SyntaxError</td><td>The code is not valid JavaScript</td><td>Missing bracket or quote</td></tr><tr><td>ReferenceError</td><td>You used a name that does not exist</td><td>Typo, or using something before creating it</td></tr><tr><td>TypeError</td><td>A value was used in a way its type does not allow</td><td>Calling something that is not a function</td></tr></table></div>
${C(`console.log("Hello"      // SyntaxError: missing closing )\nconsole.log(score);         // ReferenceError: score is not defined`)}
<p><b>A debugging routine that always works:</b></p>
<ol><li><b>Read</b> the message slowly, including the error type.</li><li><b>Find</b> the line it points to (the real mistake is often on the line before).</li><li><b>Check</b> spelling, capital letters, quotes and brackets.</li><li><b>Inspect</b> by adding ${I("console.log")} to see what values your code really has.</li><li><b>Change one thing</b> at a time and run again.</li></ol>
<div class="key"><b>Key idea</b>Do not guess. Read the message, find the line, and test. Debugging is a skill you train, not a talent you are born with.</div>${gate}`},
{phase:2,type:"final",title:"Concepts test",label:"Concepts test",pass:1,pts:5,intro:"This test covers all three concepts.",okMsg:()=>"You scored 100%. The practice lab is now unlocked.",qs:[
 {q:"Which role does JavaScript play on a web page?",o:["Behaviour","Structure","Appearance"],a:0,ref:"Concept 1: What JavaScript is",e:"JavaScript adds behaviour."},
 {q:"Which tag loads an external file named app.js?",o:["<script src=\"app.js\"><\/script>","<js src=\"app.js\"></js>","<link src=\"app.js\">"],a:0,ref:"Concept 1: What JavaScript is",e:"The script element with src."},
 {q:"What does this code print?\nconsole.log(\"A\");\nconsole.log(\"B\");",o:["A then B on two lines","B then A","AB on one line"],a:0,ref:"Concept 2: Statements",e:"Statements run top to bottom."},
 {q:"Which line is valid JavaScript?",o:["console.log(\"Hi\");","Console.Log(\"Hi\");","console.write(\"Hi\")"],a:0,ref:"Concept 2: Statements",e:"JavaScript is case-sensitive."},
 {q:"Which symbols start a single-line comment?",o:["//","##","<!--"],a:0,ref:"Concept 2: Statements",e:"// starts a comment."},
 {q:"console.log(score); runs, but score was never created. Which error appears?",o:["ReferenceError","SyntaxError","No error"],a:0,ref:"Concept 3: Errors",e:"The name does not exist."},
 {q:"console.log(\"Hi\" is missing its closing bracket. Which error?",o:["SyntaxError","ReferenceError","TypeError"],a:0,ref:"Concept 3: Errors",e:"Broken grammar is a SyntaxError."},
 {q:"What should you do first when you see an error?",o:["Read the message and the line number","Delete all the code","Restart the computer"],a:0,ref:"Concept 3: Errors",e:"Read the message first."}]},
{phase:3,type:"jslab",title:"Exercise 1: Your first output",label:"Practice lab 1 of 2",pts:20,task:"Write a program that prints exactly Hello, NET Academy! on one line, then prints a second line of your choice. Include at least one comment. Press Run to test.",start:"// Write your code below\n",
 reqs:[["Prints Hello, NET Academy!",(c,o)=>has(o,"Hello, NET Academy!")],["Prints at least two lines",(c,o)=>lines(o).length>=2],["Contains a comment",(c,o)=>/\/\/|\/\*/.test(c)],["Runs without errors",(c,o)=>!/^Error/m.test(o)]],
 hint:'Use console.log("Hello, NET Academy!"); then a second console.log("..."); and start one line with //',sol:'// My first program\nconsole.log("Hello, NET Academy!");\nconsole.log("I am learning JavaScript.");'},
{phase:3,type:"jslab",title:"Exercise 2: Fix the errors",label:"Practice lab 2 of 2",pts:20,task:"This program has two mistakes. Press Run, read the error message, and fix the code until both messages print.",start:'console.log("Learning JavaScript"\nconsole.log("It is fun!);\n',
 reqs:[["Prints Learning JavaScript",(c,o)=>has(o,"Learning JavaScript")],["Prints It is fun!",(c,o)=>has(o,"It is fun!")],["Runs without errors",(c,o)=>o.length>0&&!/^Error/m.test(o)]],
 hint:"Line 1 is missing a closing bracket ). Line 2 is missing a closing quote.",sol:'console.log("Learning JavaScript");\nconsole.log("It is fun!");'},
{phase:4,type:"final",title:"Final test",label:"Final test",pass:1,pts:5,intro:"This is the last step of the lesson.",okMsg:()=>"You scored 100%. Total points: "+points+" / "+MAX+". Next: JavaScript Lesson 2, Variables and data types.",qs:[
 {q:"Which pair is correct?",o:["HTML structure, CSS appearance, JavaScript behaviour","HTML behaviour, CSS structure, JavaScript appearance","HTML appearance, CSS behaviour, JavaScript structure"],a:0,ref:"Concept 1",e:"Structure, appearance, behaviour."},
 {q:"In what order does JavaScript run statements?",o:["Top to bottom","Bottom to top","Randomly"],a:0,ref:"Concept 2",e:"Top to bottom."},
 {q:"What does the computer do with comments?",o:["Ignores them","Prints them","Runs them"],a:0,ref:"Concept 2",e:"Comments are for humans."},
 {q:"Is console.log the same as Console.log?",o:["No, JavaScript is case-sensitive","Yes","Only on phones"],a:0,ref:"Concept 2",e:"Case matters."},
 {q:"A ReferenceError usually means:",o:["A name does not exist","A bracket is missing","The page is slow"],a:0,ref:"Concept 3",e:"The name is undefined."},
 {q:"Which step in debugging inspects real values?",o:["Adding console.log","Deleting the file","Ignoring the error"],a:0,ref:"Concept 3",e:"console.log shows values."}]}
];

/* ---------- engine ---------- */
const N=pages.length,done=Array(N).fill(false);let cur=0,points=0;
const MAX=pages.reduce((s,p)=>s+(p.type==="lab"||p.type==="jslab"?p.pts:(p.qs?p.qs.length*p.pts:0)),0);
const main=$("main");
function add(n){if(!n)return;points+=n;$("pts").textContent=points+" pts";const t=$("toast");t.textContent="+"+n+" points";t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1000)}
function complete(i){done[i]=true;refresh();if(i===N-1)save()}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

pages.forEach((pg,i)=>{
  const sec=mk("section","page");sec.dataset.i=i;
  sec.appendChild(mk("p","eyebrow",pg.label));
  sec.appendChild(mk("h1",null,pg.title));
  if(pg.type==="read"){const d=mk("div");d.innerHTML=pg.html;sec.appendChild(d);done[i]=true}
  if(pg.type==="quiz")buildQuiz(sec,pg,i);
  if(pg.type==="lab")buildLab(sec,pg,i);
  if(pg.type==="jslab")buildJsLab(sec,pg,i);
  if(pg.type==="final")buildFinal(sec,pg,i);
  main.appendChild(sec);
});

function buildQuiz(sec,pg,i){
  sec.appendChild(mk("p","m",pg.intro));let ok=0;
  pg.qs.forEach((it,k)=>{
    const box=mk("div","q");box.appendChild(mk("p","qt",(k+1)+". "+it.q));
    const og=mk("div","opts"),fb=mk("div","fb");let missed=false,solved=false;
    it.o.forEach((t,j)=>{
      const b=mk("button","opt",t);b.type="button";
      b.onclick=()=>{
        if(solved)return;
        if(j===it.a){solved=true;b.classList.add("good");fb.className="fb ok";fb.textContent="Correct. "+it.e;og.querySelectorAll(".opt").forEach(x=>x.disabled=true);add(missed?pg.pts/2:pg.pts);ok++;if(ok===pg.qs.length)complete(i)}
        else{missed=true;b.classList.add("bad");b.disabled=true;fb.className="fb no";fb.textContent="Not quite. Try another answer."}
      };og.appendChild(b);
    });
    box.appendChild(og);box.appendChild(fb);sec.appendChild(box);
  });
}

function buildLab(sec,pg,i){
  sec.classList.add("lab");
  sec.appendChild(mk("p",null,pg.task));
  sec.appendChild(mk("p","m","Requirements:"));
  const ul=mk("ul","req");pg.reqs.forEach(r=>ul.appendChild(mk("li",null,r[0])));sec.appendChild(ul);
  const ed=mk("div","ed"),l1=mk("div","l","Your code"),ta=mk("textarea"),l2=mk("div","l","Result"),fr=mk("iframe");
  ta.value=pg.start;ta.spellcheck=false;ta.setAttribute("autocapitalize","off");ta.setAttribute("autocorrect","off");ta.setAttribute("aria-label","Your code");
  fr.title="Result";fr.setAttribute("sandbox","");fr.srcdoc=pg.start;
  [l1,ta,l2,fr].forEach(x=>ed.appendChild(x));sec.appendChild(ed);
  const tools=mk("div","tools"),hb=mk("button","sm","Show hint"),sb2=mk("button","sm","Show solution"),rb=mk("button","sm","Reset");
  [hb,sb2,rb].forEach(b=>{b.type="button";tools.appendChild(b)});sec.appendChild(tools);
  const hint=mk("div","hint",pg.hint);sec.appendChild(hint);
  let usedSol=false;
  const check=()=>{
    fr.srcdoc=ta.value;let all=true;
    [...ul.children].forEach((li,k)=>{const p=pg.reqs[k][1](ta.value);li.classList.toggle("ok",p);if(!p)all=false});
    if(all&&!done[i]){add(usedSol?pg.pts/2:pg.pts);complete(i)}
  };
  ta.addEventListener("input",check);
  hb.onclick=()=>{hint.style.display=hint.style.display==="block"?"none":"block"};
  sb2.onclick=()=>{if(!done[i]&&!confirm("Show the solution? You will earn half the points for this exercise."))return;if(!done[i])usedSol=true;ta.value=pg.sol;check()};
  rb.onclick=()=>{ta.value=pg.start;check()};
  fr.srcdoc=pg.start;
}

function buildJsLab(sec,pg,i){
  sec.classList.add("lab");
  sec.appendChild(mk("p",null,pg.task));
  sec.appendChild(mk("p","m","Requirements (checked when you press Run):"));
  const ul=mk("ul","req");pg.reqs.forEach(r=>ul.appendChild(mk("li",null,r[0])));sec.appendChild(ul);
  const idle="Press Run to see the output here.";
  const ed=mk("div","ed"),l1=mk("div","l","Your JavaScript"),ta=mk("textarea"),l2=mk("div","l","Output"),out=mk("pre","outp",idle);
  ta.value=pg.start;ta.spellcheck=false;ta.setAttribute("autocapitalize","off");ta.setAttribute("autocorrect","off");ta.setAttribute("aria-label","Your JavaScript");
  [l1,ta,l2,out].forEach(x=>ed.appendChild(x));sec.appendChild(ed);
  const tools=mk("div","tools"),run=mk("button","btn","Run code"),hb=mk("button","sm","Show hint"),sb2=mk("button","sm","Show solution"),rb=mk("button","sm","Reset");
  run.style.minHeight="42px";run.style.padding="0 20px";
  [run,hb,sb2,rb].forEach(b=>{b.type="button";tools.appendChild(b)});sec.appendChild(tools);
  const hint=mk("div","hint",pg.hint);sec.appendChild(hint);
  const fr=mk("iframe");fr.setAttribute("sandbox","allow-scripts");fr.style.display="none";fr.title="Code runner";sec.appendChild(fr);
  let usedSol=false,token=0;
  const judge=o=>{
    out.textContent=o.length?o:"(no output)";
    let all=true;
    [...ul.children].forEach((li,k)=>{let p=false;try{p=!!pg.reqs[k][1](ta.value,o)}catch(e){}li.classList.toggle("ok",p);if(!p)all=false});
    if(all&&!done[i]){add(usedSol?pg.pts/2:pg.pts);complete(i)}
  };
  window.addEventListener("message",e=>{
    if(e.source!==fr.contentWindow||!e.data||e.data.k!=="net-run"||e.data.t!==token)return;
    judge(e.data.out.join("\n"));
  });
  const exec=()=>{
    token++;out.textContent="Running...";
    const code=JSON.stringify(ta.value).replace(/</g,"\\u003c");
    fr.srcdoc='<script>(function(){var L=[];var f=function(){return Array.prototype.map.call(arguments,function(x){try{return typeof x==="object"&&x!==null?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")};'
      +'["log","info","warn","error"].forEach(function(m){console[m]=function(){L.push(f.apply(null,arguments))}});window.alert=function(x){L.push(String(x))};'
      +'try{(new Function('+code+'))()}catch(e){L.push("Error: "+e.name+": "+e.message)}'
      +'parent.postMessage({k:"net-run",t:'+token+',out:L},"*");})();<\/script>';
  };
  run.onclick=exec;
  hb.onclick=()=>{hint.style.display=hint.style.display==="block"?"none":"block"};
  sb2.onclick=()=>{if(!done[i]&&!confirm("Show the solution? You will earn half the points for this exercise."))return;if(!done[i])usedSol=true;ta.value=pg.sol;exec()};
  rb.onclick=()=>{ta.value=pg.start;out.textContent=idle;[...ul.children].forEach(li=>li.classList.remove("ok"))};
}

function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function buildFinal(sec,pg,i){
  const need=Math.round(pg.pass*100);
  sec.appendChild(mk("p","m",pg.intro+" Answer all "+pg.qs.length+" questions, then submit. You need "+need+"% to continue. You can retake the test, and the order of questions and answers changes each time."));
  const ans={},wrap=mk("div"),res=mk("div"),sub=mk("button","btn","Submit test");sub.type="button";let best=0;
  const render=()=>{
    wrap.innerHTML="";res.innerHTML="";sub.style.display="";sub.disabled=true;
    Object.keys(ans).forEach(k=>delete ans[k]);
    shuffle(pg.qs.map((q,k)=>k)).forEach((qi,n)=>{
      const it=pg.qs[qi],box=mk("div","q");box.appendChild(mk("p","qt",(n+1)+". "+it.q));const og=mk("div","opts");
      shuffle(it.o.map((t,j)=>j)).forEach(j=>{
        const b=mk("button","opt",it.o[j]);b.type="button";
        b.onclick=()=>{ans[qi]=j;og.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sub.disabled=Object.keys(ans).length<pg.qs.length};
        og.appendChild(b);
      });
      box.appendChild(og);wrap.appendChild(box);
    });
  };
  sub.onclick=()=>{
    const right=pg.qs.filter((it,k)=>ans[k]===it.a).length,pct=right/pg.qs.length,passed=pct>=pg.pass;
    if(right>best){add((right-best)*pg.pts);best=right}
    sub.style.display="none";wrap.innerHTML="";res.innerHTML="";
    const box=mk("div","res "+(passed?"pass":"fail"));
    box.appendChild(mk("div","big",right+" / "+pg.qs.length+"  ("+Math.round(pct*100)+"%)"));
    box.appendChild(mk("div","st",passed?"Passed":"Not passed. "+need+"% is required."));
    box.appendChild(mk("p","m",passed?pg.okMsg():"Every question must be correct to continue. Review the topics listed below, then retake the test."));
    pg.qs.forEach((it,k)=>{
      const ok=ans[k]===it.a,d=mk("div","rv");
      d.textContent=passed?(k+1)+". Correct. "+it.e:(ok?"Correct: "+it.q:"Incorrect: "+it.q+"  Review: "+it.ref+".");
      d.style.color=ok?"var(--ok)":"var(--err)";box.appendChild(d);
    });
    if(!passed){const rt=mk("button","btn","Retake test");rt.type="button";rt.style.marginTop="12px";rt.onclick=()=>{render()};box.appendChild(rt)}
    res.appendChild(box);if(passed)complete(i);
  };
  sec.appendChild(wrap);sec.appendChild(sub);sec.appendChild(res);render();
}

/* ---------- navigation ---------- */
const stepsEl=$("steps");
PH.forEach(n=>{const d=mk("div","ph");d.innerHTML='<i><b></b></i>';d.appendChild(document.createTextNode(n));stepsEl.appendChild(d)});
function refresh(){
  document.querySelectorAll(".page").forEach((s,k)=>s.classList.toggle("on",k===cur));
  [...stepsEl.children].forEach((el,p)=>{
    const idx=pages.map((x,k)=>x.phase===p?k:-1).filter(k=>k>=0);
    const d=idx.filter(k=>done[k]&&(pages[k].type!=="read"||k<cur||(k===cur))).length;
    el.querySelector("b").style.width=Math.round(d/idx.length*100)+"%";el.classList.toggle("on",pages[cur].phase===p);
  });
  const last=cur===N-1;
  $("back").style.visibility=cur===0?"hidden":"visible";
  $("cnt").textContent=(cur+1)+" / "+N;
  $("next").textContent=last?"Finish lesson":"Continue";
  $("next").disabled=!done[cur];
}
$("next").onclick=async()=>{if(cur===N-1){if(!saved)await save();if(saved)location.href="dashboard.html"}else{cur++;refresh();window.scrollTo(0,0)}};
$("back").onclick=()=>{if(cur>0){cur--;refresh();window.scrollTo(0,0)}};
refresh();
</script>

{phase:1,type:"read",title:"Asynchronous code and the order of execution",label:"Concept 1 of 3",html:`
<p>JavaScript does <b>one thing at a time</b>. If it waited for a slow task (a network request taking 2 seconds), the whole page would freeze. So for slow tasks, JavaScript hands the job to the browser, <b>keeps running the rest of your code</b>, and comes back to the result later.</p>
<p><b>An analogy:</b> a waiter takes your order, gives it to the kitchen, and serves other tables while your food cooks. When the food is ready, the waiter brings it. The waiter never stands still waiting for one dish.</p>
${C(`console.log("A");\n\nsetTimeout(() => {\n  console.log("B");\n}, 1000);\n\nconsole.log("C");`)}
<p>What is printed? Not A, B, C. The real output is:</p>
<pre><code>A\nC\nB</code></pre>
<p><b>Trace:</b></p>
<ol><li>${I('console.log("A")')} runs and prints A.</li><li>${I("setTimeout")} asks the browser to run the function after 1000 ms, and the code <b>moves on immediately</b>.</li><li>${I('console.log("C")')} prints C.</li><li>One second later, the browser calls the stored function, which prints B.</li></ol>
<p>Even with a delay of ${I("0")}, the callback still runs <b>after</b> all the current code has finished.</p>
<div class="tw"><table><tr><th>Tool</th><th>Does</th></tr><tr><td>${I("setTimeout(fn, ms)")}</td><td>Runs fn once, after ms milliseconds</td></tr><tr><td>${I("setInterval(fn, ms)")}</td><td>Runs fn repeatedly, every ms milliseconds</td></tr></table></div>
<div class="key"><b>Key idea</b>Asynchronous code does not run in the order you write it. Code that waits finishes <b>later</b>, so anything that depends on its result must be placed <b>inside</b> its callback, or after an ${I("await")}.</div>`},
{phase:1,type:"read",title:"Promises and async/await",label:"Concept 2 of 3",html:`
<p>Nesting callbacks inside callbacks becomes unreadable ("callback hell"). A <b>promise</b> is an object that represents a result that will arrive in the future. It is always in one of three states:</p>
<div class="tw"><table><tr><th>State</th><th>Meaning</th></tr><tr><td>pending</td><td>Still waiting</td></tr><tr><td>fulfilled</td><td>Finished successfully, with a value</td></tr><tr><td>rejected</td><td>Failed, with an error</td></tr></table></div>
${C(`const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));\n\nwait(500)\n  .then(() => console.log("Half a second later"))\n  .catch((err) => console.log("Failed", err));`)}
<p>${I("async")} / ${I("await")} lets you write the same thing so it <b>reads top to bottom</b>:</p>
${C(`async function run() {\n  console.log("Start");\n  await wait(500);            // pause THIS function, not the page\n  console.log("Half a second later");\n}\nrun();`)}
<div class="tw"><table><tr><th>Keyword</th><th>Rule</th></tr><tr><td>${I("async")}</td><td>Before a function. It always returns a promise</td></tr><tr><td>${I("await")}</td><td>Inside an async function. Waits for a promise and gives its value</td></tr><tr><td>${I("try / catch")}</td><td>Handles a rejected promise, like an ordinary error</td></tr></table></div>
${C(`async function safe() {\n  try {\n    const value = await somethingThatMightFail();\n    console.log(value);\n  } catch (error) {\n    console.log("Something went wrong:", error.message);\n  }\n}`)}
<div class="key"><b>Key idea</b>${I("await")} pauses only the <b>function it is in</b>. The rest of the page keeps working. Forgetting ${I("await")} gives you a pending promise instead of the value.</div>`},
{phase:1,type:"read",title:"fetch and JSON",label:"Concept 3 of 3",html:`
<p>${I("fetch(url)")} asks a server for data and returns a <b>promise</b> of a response. Reading the body is also asynchronous, so you await twice:</p>
${C(`async function loadUsers() {\n  const response = await fetch("https://api.netacademy.example/users");\n\n  if (!response.ok) {                     // 404, 500, ...\n    throw new Error("Request failed: " + response.status);\n  }\n\n  const users = await response.json();   // parse the JSON body\n  console.log(users[0].name);\n}`)}
<p><b>The practice API.</b> In this lesson's code box, ${I("fetch")} talks to a built-in practice server at ${I("https://api.netacademy.example/users")} so every student gets the same data. The code you write is the same as on a real site.</p>
<div class="warn"><b>Important: fetch only rejects on network failure</b>A 404 or 500 response is <b>not</b> an error to ${I("fetch")}. The promise still succeeds. You must check ${I("response.ok")} yourself.</div>
<p>A complete, professional pattern combines everything:</p>

<div class="warn"><b>Security notes</b>Never put secret API keys in front-end code: anyone can read it. Never trust data from a server blindly: put text on the page with ${I("textContent")}, not ${I("innerHTML")}. Websites also need the server to allow requests from other origins (CORS).</div>${gate}`},

/* ---------- engine ---------- */
const N=pages.length,done=Array(N).fill(false);let cur=0,points=0;
const MAX=pages.reduce((s,p)=>s+(p.type==="lab"||p.type==="jslab"||p.type==="domlab"?p.pts:(p.qs?p.qs.length*p.pts:0)),0);
const main=$("main");
function add(n){if(!n)return;points+=n;$("pts").textContent=points+" pts";const t=$("toast");t.textContent="+"+n+" points";t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1000)}
function complete(i){done[i]=true;refresh();if(i===N-1)save()}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

pages.forEach((pg,i)=>{
  const sec=mk("section","page");sec.dataset.i=i;
  sec.appendChild(mk("p","eyebrow",pg.label));
  sec.appendChild(mk("h1",null,pg.title));
  if(pg.type==="read"){const d=mk("div");d.innerHTML=pg.html;sec.appendChild(d);done[i]=true}
  if(pg.type==="quiz")buildQuiz(sec,pg,i);
  if(pg.type==="lab")buildLab(sec,pg,i);
  if(pg.type==="jslab")buildJsLab(sec,pg,i);
  if(pg.type==="domlab")buildDomLab(sec,pg,i);
  if(pg.type==="final")buildFinal(sec,pg,i);
  main.appendChild(sec);
});

function buildQuiz(sec,pg,i){
  sec.appendChild(mk("p","m",pg.intro));let ok=0;
  pg.qs.forEach((it,k)=>{
    const box=mk("div","q");box.appendChild(mk("p","qt",(k+1)+". "+it.q));
    const og=mk("div","opts"),fb=mk("div","fb");let missed=false,solved=false;
    it.o.forEach((t,j)=>{
      const b=mk("button","opt",t);b.type="button";
      b.onclick=()=>{
        if(solved)return;
        if(j===it.a){solved=true;b.classList.add("good");fb.className="fb ok";fb.textContent="Correct. "+it.e;og.querySelectorAll(".opt").forEach(x=>x.disabled=true);add(missed?pg.pts/2:pg.pts);ok++;if(ok===pg.qs.length)complete(i)}
        else{missed=true;b.classList.add("bad");b.disabled=true;fb.className="fb no";fb.textContent="Not quite. Try another answer."}
      };og.appendChild(b);
    });
    box.appendChild(og);box.appendChild(fb);sec.appendChild(box);
  });
}

function buildLab(sec,pg,i){
  sec.classList.add("lab");
  sec.appendChild(mk("p",null,pg.task));
  sec.appendChild(mk("p","m","Requirements:"));
  const ul=mk("ul","req");pg.reqs.forEach(r=>ul.appendChild(mk("li",null,r[0])));sec.appendChild(ul);
  const ed=mk("div","ed"),l1=mk("div","l","Your code"),ta=mk("textarea"),l2=mk("div","l","Result"),fr=mk("iframe");
  ta.value=pg.start;ta.spellcheck=false;ta.setAttribute("autocapitalize","off");ta.setAttribute("autocorrect","off");ta.setAttribute("aria-label","Your code");
  fr.title="Result";fr.setAttribute("sandbox","");fr.srcdoc=pg.start;
  [l1,ta,l2,fr].forEach(x=>ed.appendChild(x));sec.appendChild(ed);
  const tools=mk("div","tools"),hb=mk("button","sm","Show hint"),sb2=mk("button","sm","Show solution"),rb=mk("button","sm","Reset");
  [hb,sb2,rb].forEach(b=>{b.type="button";tools.appendChild(b)});sec.appendChild(tools);
  const hint=mk("div","hint",pg.hint);sec.appendChild(hint);
  let usedSol=false;
  const check=()=>{
    fr.srcdoc=ta.value;let all=true;
    [...ul.children].forEach((li,k)=>{const p=pg.reqs[k][1](ta.value);li.classList.toggle("ok",p);if(!p)all=false});
    if(all&&!done[i]){add(usedSol?pg.pts/2:pg.pts);complete(i)}
  };
  ta.addEventListener("input",check);
  hb.onclick=()=>{hint.style.display=hint.style.display==="block"?"none":"block"};
  sb2.onclick=()=>{if(!done[i]&&!confirm("Show the solution? You will earn half the points for this exercise."))return;if(!done[i])usedSol=true;ta.value=pg.sol;check()};
  rb.onclick=()=>{ta.value=pg.start;check()};
  fr.srcdoc=pg.start;
}

const JSRT=function(CODE,T){
  var L=[];
  var f=function(){return Array.prototype.map.call(arguments,function(x){try{return typeof x==="object"&&x!==null?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")};
  ["log","info","warn","error"].forEach(function(m){console[m]=function(){L.push(f.apply(null,arguments))}});
  window.alert=function(x){L.push(String(x))};
  var USERS=[{id:1,name:"Amina",role:"student"},{id:2,name:"John",role:"mentor"},{id:3,name:"Eva",role:"student"}];
  window.fetch=function(u){return new Promise(function(res){setTimeout(function(){
    var m=String(u).match(/\/users(?:\/(\d+))?$/),body=null,ok=false,st=404;
    if(m){if(m[1]){var x=USERS.filter(function(y){return y.id===+m[1]})[0];if(x){body=x;ok=true;st=200}}else{body=USERS;ok=true;st=200}}
    res({ok:ok,status:st,json:function(){return Promise.resolve(body)},text:function(){return Promise.resolve(JSON.stringify(body))}});
  },150)})};
  var post=function(){parent.postMessage({k:"net-run",t:T,out:L},"*")};
  var AF=Object.getPrototypeOf(async function(){}).constructor;
  var slow=/setTimeout|setInterval|Promise|\.then|await|fetch/.test(CODE);
  var p;
  try{p=new AF(CODE)()}catch(e){L.push("Error: "+e.name+": "+e.message);post();return}
  p.then(function(){},function(e){L.push("Error: "+e.name+": "+e.message)}).then(function(){setTimeout(post,slow?1000:0)});
};
const DOMRT=function(CODE,ACT,T,TEST){
  var L=[];
  var f=function(){return Array.prototype.map.call(arguments,function(x){try{return typeof x==="object"&&x!==null?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")};
  ["log","info","warn","error"].forEach(function(m){console[m]=function(){L.push(f.apply(null,arguments))}});
  window.alert=function(x){L.push(String(x))};
  try{(new Function(CODE))()}catch(e){L.push("Error: "+e.name+": "+e.message);if(!TEST){var d=document.createElement("pre");d.style.cssText="color:#b42329;font:13px monospace;white-space:pre-wrap";d.textContent=L[L.length-1];document.body.appendChild(d)}}
  if(!TEST)return;
  try{(new Function(ACT))()}catch(e){L.push("Test error: "+e.name+": "+e.message)}
  var b=document.body.cloneNode(true),s=b.querySelectorAll("script");for(var k=0;k<s.length;k++)s[k].remove();
  parent.postMessage({k:"net-run",t:T,out:L,dom:b.innerHTML},"*");
};
const esc=s=>JSON.stringify(s).replace(/</g,"\\u003c");
function buildJsLab(sec,pg,i){
  sec.classList.add("lab");
  sec.appendChild(mk("p",null,pg.task));
  sec.appendChild(mk("p","m","Requirements (checked when you press Run):"));
  const ul=mk("ul","req");pg.reqs.forEach(r=>ul.appendChild(mk("li",null,r[0])));sec.appendChild(ul);
  const idle="Press Run to see the output here.";
  const ed=mk("div","ed"),l1=mk("div","l","Your JavaScript"),ta=mk("textarea"),l2=mk("div","l","Output"),out=mk("pre","outp",idle);
  ta.value=pg.start;ta.spellcheck=false;ta.setAttribute("autocapitalize","off");ta.setAttribute("autocorrect","off");ta.setAttribute("aria-label","Your JavaScript");
  [l1,ta,l2,out].forEach(x=>ed.appendChild(x));sec.appendChild(ed);
  const tools=mk("div","tools"),run=mk("button","btn","Run code"),hb=mk("button","sm","Show hint"),sb2=mk("button","sm","Show solution"),rb=mk("button","sm","Reset");
  run.style.minHeight="42px";run.style.padding="0 20px";
  [run,hb,sb2,rb].forEach(b=>{b.type="button";tools.appendChild(b)});sec.appendChild(tools);
  const hint=mk("div","hint",pg.hint);sec.appendChild(hint);
  const fr=mk("iframe");fr.setAttribute("sandbox","allow-scripts");fr.style.display="none";fr.title="Code runner";sec.appendChild(fr);
  let usedSol=false,token=0;
  const judge=o=>{
    out.textContent=o.length?o:"(no output)";
    let all=true;
    [...ul.children].forEach((li,k)=>{let p=false;try{p=!!pg.reqs[k][1](ta.value,o)}catch(e){}li.classList.toggle("ok",p);if(!p)all=false});
    if(all&&!done[i]){add(usedSol?pg.pts/2:pg.pts);complete(i)}
  };
  window.addEventListener("message",e=>{
    if(e.source!==fr.contentWindow||!e.data||e.data.k!=="net-run"||e.data.t!==token)return;
    judge(e.data.out.join("\n"));
  });
  const exec=()=>{token++;out.textContent="Running...";fr.srcdoc='<script>('+JSRT.toString()+')('+esc(ta.value)+','+token+')<\/script>'};
  run.onclick=exec;
  hb.onclick=()=>{hint.style.display=hint.style.display==="block"?"none":"block"};
  sb2.onclick=()=>{if(!done[i]&&!confirm("Show the solution? You will earn half the points for this exercise."))return;if(!done[i])usedSol=true;ta.value=pg.sol;exec()};
  rb.onclick=()=>{ta.value=pg.start;out.textContent=idle;[...ul.children].forEach(li=>li.classList.remove("ok"))};
}
function buildDomLab(sec,pg,i){
  sec.classList.add("lab");
  sec.appendChild(mk("p",null,pg.task));
  sec.appendChild(mk("p","m","Requirements (checked when you press Run):"));
  const ul=mk("ul","req");pg.reqs.forEach(r=>ul.appendChild(mk("li",null,r[0])));sec.appendChild(ul);
  const det=mk("details"),sm=mk("summary",null,"Show the page HTML (read only)"),pre=mk("pre",null,pg.html);det.appendChild(sm);det.appendChild(pre);sec.appendChild(det);
  const idle="Press Run. Console messages and errors appear here.";
  const ed=mk("div","ed"),l1=mk("div","l","Your JavaScript"),ta=mk("textarea"),l3=mk("div","l","Your page (live, try clicking it)"),view=mk("iframe"),l2=mk("div","l","Console"),out=mk("pre","outp",idle);
  ta.value=pg.start;ta.spellcheck=false;ta.setAttribute("autocapitalize","off");ta.setAttribute("autocorrect","off");ta.setAttribute("aria-label","Your JavaScript");
  view.setAttribute("sandbox","allow-scripts");view.title="Your page";view.style.height="170px";
  [l1,ta,l3,view,l2,out].forEach(x=>ed.appendChild(x));sec.appendChild(ed);
  const tools=mk("div","tools"),run=mk("button","btn","Run code"),hb=mk("button","sm","Show hint"),sb2=mk("button","sm","Show solution"),rb=mk("button","sm","Reset");
  run.style.minHeight="42px";run.style.padding="0 20px";
  [run,hb,sb2,rb].forEach(b=>{b.type="button";tools.appendChild(b)});sec.appendChild(tools);
  const hint=mk("div","hint",pg.hint);sec.appendChild(hint);
  const fr=mk("iframe");fr.setAttribute("sandbox","allow-scripts");fr.style.display="none";fr.title="Test runner";sec.appendChild(fr);
  let usedSol=false,token=0;
  const judge=(o,d)=>{
    out.textContent=o.length?o:"(no console output)";
    let all=true;
    [...ul.children].forEach((li,k)=>{let p=false;try{p=!!pg.reqs[k][1](ta.value,o,d)}catch(e){}li.classList.toggle("ok",p);if(!p)all=false});
    if(all&&!done[i]){add(usedSol?pg.pts/2:pg.pts);complete(i)}
  };
  window.addEventListener("message",e=>{
    if(e.source!==fr.contentWindow||!e.data||e.data.k!=="net-run"||e.data.t!==token)return;
    judge(e.data.out.join("\n"),e.data.dom);
  });
  const exec=()=>{
    token++;out.textContent="Running...";
    const page=h=>'<body style="font-family:sans-serif;margin:12px">'+pg.html+'<script>('+DOMRT.toString()+')('+esc(ta.value)+','+h+')<\/script></body>';
    view.srcdoc=page('"",0,false');
    fr.srcdoc=page(esc(pg.act||"")+','+token+',true');
  };
  run.onclick=exec;
  hb.onclick=()=>{hint.style.display=hint.style.display==="block"?"none":"block"};
  sb2.onclick=()=>{if(!done[i]&&!confirm("Show the solution? You will earn half the points for this exercise."))return;if(!done[i])usedSol=true;ta.value=pg.sol;exec()};
  rb.onclick=()=>{ta.value=pg.start;out.textContent=idle;[...ul.children].forEach(li=>li.classList.remove("ok"))};
  view.srcdoc='<body style="font-family:sans-serif;margin:12px">'+pg.html+'</body>';
}

function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function buildFinal(sec,pg,i){
  const need=Math.round(pg.pass*100);
  sec.appendChild(mk("p","m",pg.intro+" Answer all "+pg.qs.length+" questions, then submit. You need "+need+"% to continue. You can retake the test, and the order of questions and answers changes each time."));
  const ans={},wrap=mk("div"),res=mk("div"),sub=mk("button","btn","Submit test");sub.type="button";let best=0;
  const render=()=>{
    wrap.innerHTML="";res.innerHTML="";sub.style.display="";sub.disabled=true;
    Object.keys(ans).forEach(k=>delete ans[k]);
    shuffle(pg.qs.map((q,k)=>k)).forEach((qi,n)=>{
      const it=pg.qs[qi],box=mk("div","q");box.appendChild(mk("p","qt",(n+1)+". "+it.q));const og=mk("div","opts");
      shuffle(it.o.map((t,j)=>j)).forEach(j=>{
        const b=mk("button","opt",it.o[j]);b.type="button";
        b.onclick=()=>{ans[qi]=j;og.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sub.disabled=Object.keys(ans).length<pg.qs.length};
        og.appendChild(b);
      });
      box.appendChild(og);wrap.appendChild(box);
    });
  };
  sub.onclick=()=>{
    const right=pg.qs.filter((it,k)=>ans[k]===it.a).length,pct=right/pg.qs.length,passed=pct>=pg.pass;
    if(right>best){add((right-best)*pg.pts);best=right}
    sub.style.display="none";wrap.innerHTML="";res.innerHTML="";
    const box=mk("div","res "+(passed?"pass":"fail"));
    box.appendChild(mk("div","big",right+" / "+pg.qs.length+"  ("+Math.round(pct*100)+"%)"));
    box.appendChild(mk("div","st",passed?"Passed":"Not passed. "+need+"% is required."));
    box.appendChild(mk("p","m",passed?pg.okMsg():"Every question must be correct to continue. Review the topics listed below, then retake the test."));
    pg.qs.forEach((it,k)=>{
      const ok=ans[k]===it.a,d=mk("div","rv");
      d.textContent=passed?(k+1)+". Correct. "+it.e:(ok?"Correct: "+it.q:"Incorrect: "+it.q+"  Review: "+it.ref+".");
      d.style.color=ok?"var(--ok)":"var(--err)";box.appendChild(d);
    });
    if(!passed){const rt=mk("button","btn","Retake test");rt.type="button";rt.style.marginTop="12px";rt.onclick=()=>{render()};box.appendChild(rt)}
    res.appendChild(box);if(passed)complete(i);
  };
  sec.appendChild(wrap);sec.appendChild(sub);sec.appendChild(res);render();
}

/* ---------- navigation ---------- */
const stepsEl=$("steps");
PH.forEach(n=>{const d=mk("div","ph");d.innerHTML='<i><b></b></i>';d.appendChild(document.createTextNode(n));stepsEl.appendChild(d)});
function refresh(){
  document.querySelectorAll(".page").forEach((s,k)=>s.classList.toggle("on",k===cur));
  [...stepsEl.children].forEach((el,p)=>{
    const idx=pages.map((x,k)=>x.phase===p?k:-1).filter(k=>k>=0);
    const d=idx.filter(k=>done[k]&&(pages[k].type!=="read"||k<cur||(k===cur))).length;
    el.querySelector("b").style.width=Math.round(d/idx.length*100)+"%";el.classList.toggle("on",pages[cur].phase===p);
  });
  const last=cur===N-1;
  $("back").style.visibility=cur===0?"hidden":"visible";
  $("cnt").textContent=(cur+1)+" / "+N;
  $("next").textContent=last?"Finish lesson":"Continue";
  $("next").disabled=!done[cur];
}
$("next").onclick=async()=>{if(cur===N-1){if(!saved)await save();if(saved)location.href="dashboard.html"}else{cur++;refresh();window.scrollTo(0,0)}};
$("back").onclick=()=>{if(cur>0){cur--;refresh();window.scrollTo(0,0)}};
refresh();
</script>
